name: Build Dealmaker Mobile APK
on:
  push:
    branches: [dealmaker-mobile-build-1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        working-directory: dealmaker-mobile
        run: gradle --no-daemon testDebugUnitTest
      - name: Lint
        working-directory: dealmaker-mobile
        run: gradle --no-daemon lintDebug
      - name: Build APK
        working-directory: dealmaker-mobile
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature and manifest
        run: |
          APK="dealmaker-mobile/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='pl.dealmaker.mobile'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt
      - name: Prepare release artifact
        run: |
          cp dealmaker-mobile/app/build/outputs/apk/debug/app-debug.apk Dealmaker-Mobile-v1.0.0.apk
          sha256sum Dealmaker-Mobile-v1.0.0.apk > Dealmaker-Mobile-v1.0.0.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dealmaker-Mobile-v1.0.0
          path: |
            Dealmaker-Mobile-v1.0.0.apk
            Dealmaker-Mobile-v1.0.0.sha256.txt
            apk-badging.txt
          retention-days: 30
