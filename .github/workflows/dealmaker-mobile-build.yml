name: Build Dealmaker Mobile v3.0.1 APK
on:
  push:
    branches: [dealmaker-mobile-v3.0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        working-directory: dealmaker-mobile
        run: gradle --no-daemon testDebugUnitTest
      - name: Lint
        working-directory: dealmaker-mobile
        run: gradle --no-daemon lintDebug
      - name: Build APK
        working-directory: dealmaker-mobile
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK="dealmaker-mobile/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='pl.dealmaker.mobile' versionCode='4' versionName='3.0.1'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt
      - name: Android launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            adb logcat -c
            adb install -r dealmaker-mobile/app/build/outputs/apk/debug/app-debug.apk
            INSTALL_RC=$?
            adb shell am force-stop pl.dealmaker.mobile
            adb shell am start -n pl.dealmaker.mobile/.MainActivity
            START_RC=$?
            sleep 8
            adb logcat -d -v threadtime > app-logcat.txt
            PID="$(adb shell pidof pl.dealmaker.mobile | tr -d '\r')"
            echo "INSTALL_RC=$INSTALL_RC START_RC=$START_RC PID=$PID"
            echo "===== DEALMAKER ANDROIDRUNTIME ====="
            grep -n -A 80 -B 20 -E "FATAL EXCEPTION|AndroidRuntime|Process: pl.dealmaker.mobile|pl.dealmaker.mobile" app-logcat.txt | tail -n 500 || true
            echo "===== END DEALMAKER ANDROIDRUNTIME ====="
            if [ "$INSTALL_RC" -ne 0 ] || [ "$START_RC" -ne 0 ] || [ -z "$PID" ]; then
              echo "APK did not remain alive after launch"
              exit 1
            fi
            if grep -q -E "FATAL EXCEPTION.*|Process: pl.dealmaker.mobile" app-logcat.txt; then
              echo "Runtime crash detected"
              exit 1
            fi
            adb shell dumpsys activity activities | grep -q "pl.dealmaker.mobile/.MainActivity"
      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dealmaker-Mobile-v3.0.1-runtime-log
          path: app-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare release artifact
        run: |
          cp dealmaker-mobile/app/build/outputs/apk/debug/app-debug.apk Dealmaker-Mobile-v3.0.1.apk
          sha256sum Dealmaker-Mobile-v3.0.1.apk > Dealmaker-Mobile-v3.0.1.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dealmaker-Mobile-v3.0.1
          path: |
            Dealmaker-Mobile-v3.0.1.apk
            Dealmaker-Mobile-v3.0.1.sha256.txt
            apk-badging.txt
          retention-days: 30
